spring:
  application:
    name: agro-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agrodb}
    username: ${DB_USER:agro}
    password: ${DB_PASSWORD:agro}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # El esquema lo gobierna Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints.web.exposure.include: health,info

springdoc:
  swagger-ui.path: /swagger-ui.html

app:
  security:
    jwt:
      # >= 32 bytes. En producción SIEMPRE por variable de entorno.
      secret: ${JWT_SECRET:}
      issuer: agro-backend
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:4200}   # ng serve
    oauth2:
      # Adonde se redirige el navegador tras el login social (frontend)
      authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:4200/auth/oauth2/callback}   # ruta Angular
  ecf:
    ambiente: ${ECF_AMBIENTE:TESTECF}           # TESTECF | CERTECF | ECF
    certificado:
      ruta: ${ECF_CERT_PATH:}                    # .p12 emitido por entidad certificadora autorizada
      clave: ${ECF_CERT_PASSWORD:}
    envio-automatico: ${ECF_ENVIO_AUTOMATICO:false}
    consulta-estado-intervalo: 60s
