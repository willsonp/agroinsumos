# Avisos y actualizaciones de dependencias con vulnerabilidades conocidas (OWASP A06)
version: 2
updates:
  - package-ecosystem: maven
    directory: /agro-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /agro-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
